# ============================================================
# Hermes Agent — MCP 配置片段
# ============================================================
# 合并到你的 Hermes 主配置（Linux/macOS: ~/.hermes/config.yaml）
# 顶层键名是 mcp_servers，与 MiMo 的 "mcp" 不同，但 server 本体完全一样。
#
# 生效后执行: /reload-mcp
# 工具会以 mcp__websearch__web_search 的名字出现。
# ============================================================
mcp_servers:
  websearch:
    command: "node"
    args: ["C:/Users/TWFU_wcy/mcp-servers/websearch-ring/index.js"]
    env:
      # 轮转顺序：限流或失败时自动切下一家
      WEBSEARCH_VENDORS: "exa,tavily,bing"
      WEBSEARCH_TIMEOUT_MS: "12000"
      WEBSEARCH_TTL_MS: "1200000"
      WEBSEARCH_MAX_CHARS: "12000"
      # 留空走 keyless；填了就用你自己的额度。
      # 支持 Hermes 的 ${env:VAR} 写法：
      # EXA_API_KEY: "${env:EXA_API_KEY}"
      # TAVILY_API_KEY: "${env:TAVILY_API_KEY}"
    enabled: true
    timeout: 120
